<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Lista de Compras"/>
<meta name="theme-color" content="#ffffff"/>
<title>Lista de Compras</title>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, push, remove, update }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  const firebaseConfig = {
    apiKey: "AIzaSyDB21rD8B3f_b2rLcIiulAqgrZIYdyPLvI",
    authDomain: "controle-de-custos-39c67.firebaseapp.com",
    databaseURL: "https://controle-de-custos-39c67-default-rtdb.firebaseio.com",
    projectId: "controle-de-custos-39c67",
    storageBucket: "controle-de-custos-39c67.firebasestorage.app",
    messagingSenderId: "320742412317",
    appId: "1:320742412317:web:acc6d8fdcfe5597e3c36f4"
  };
  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);
  window._db=db; window._ref=ref; window._onValue=onValue;
  window._push=push; window._remove=remove; window._update=update;
  window._fbReady=true;
  window.dispatchEvent(new Event("fbready"));
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --green:#16a34a;--gl:#dcfce7;--gm:#bbf7d0;
  --bg:#f8fafc;--white:#fff;--text:#1e293b;--text2:#64748b;--text3:#94a3b8;
  --border:#e2e8f0;--border2:#cbd5e1;--rs:12px;--rx:8px;
  --shadow:0 1px 8px rgba(0,0,0,.08)
}
html,body{height:100%;overflow:hidden;background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text)}

/* APP SHELL */
#app{height:100%;height:100dvh;display:flex;flex-direction:column;max-width:430px;margin:0 auto}

/* HEADER — fixo */
#header{background:var(--white);border-bottom:1px solid var(--border);box-shadow:var(--shadow);flex-shrink:0}
.hd-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.logo{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800}
.logo-ico{width:32px;height:32px;border-radius:9px;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:17px}
.hd-right{display:flex;align-items:center;gap:8px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#fbbf24;transition:background .3s}
.sync-dot.ok{background:var(--green)}.sync-dot.err{background:#ef4444}
.user-btn{background:var(--green);border:none;width:30px;height:30px;border-radius:50%;color:#fff;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit}
.stats-bar{display:flex;padding:8px 16px;border-bottom:1px solid var(--border)}
.stat{flex:1;text-align:center}
.stat-val{font-size:17px;font-weight:900}
.stat-lbl{font-size:9px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:1px}
.stat-div{width:1px;background:var(--border);margin:3px 0}
.prog-wrap{padding:8px 16px 12px;border-bottom:1px solid var(--border)}
.prog-bar{height:7px;background:var(--border);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--green),#22c55e);border-radius:4px;transition:width .4s}
.prog-lbl{font-size:10px;color:var(--text2);font-weight:600;margin-top:4px;text-align:right}

/* ADD FORM */
#add-form{padding:12px 14px;background:var(--white);border-bottom:1px solid var(--border);flex-shrink:0}
.add-row{display:flex;gap:8px}
.add-input{flex:1;padding:11px 13px;border:1.5px solid var(--border2);border-radius:var(--rx);font-size:15px;font-family:inherit;color:var(--text);background:var(--bg);outline:none;transition:border .2s}
.add-input:focus{border-color:var(--green);background:var(--white)}
.add-input::placeholder{color:var(--text3)}
.add-btn{width:44px;height:44px;border-radius:var(--rx);background:var(--green);border:none;color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* SCROLL AREA — só essa rola */
#scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:12px 14px 100px}
#scroll-area::-webkit-scrollbar{display:none}
#scroll-area{scrollbar-width:none;-ms-overflow-style:none}

.sec-title{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center}
.sec-hint{font-size:10px;color:var(--text3);margin-bottom:10px}
.clear-btn{background:none;border:none;color:#ef4444;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
.item-list{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}

/* ITEM */
.item-card{background:var(--white);border-radius:var(--rs);border:1px solid var(--border);padding:12px 12px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);position:relative;transition:opacity .2s,box-shadow .2s}
.item-card.done{background:#f8fffe;border-color:var(--gm);opacity:.7}
.item-card.is-dragging{opacity:.35;box-shadow:none}
.item-card.drag-above{border-top:2px solid var(--green)}
.item-card.drag-below{border-bottom:2px solid var(--green)}

/* DRAG HANDLE */
.handle{width:28px;height:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex-shrink:0;cursor:grab;touch-action:none}
.handle span{display:block;width:14px;height:2px;background:var(--text3);border-radius:1px}
.item-card.done .handle{visibility:hidden}

/* CHECKBOX */
.chk{width:25px;height:25px;border-radius:7px;border:2px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;background:var(--white);cursor:pointer}
.chk.on{background:var(--green);border-color:var(--green)}
.chk-ico{color:#fff;font-size:14px;font-weight:900;display:none}
.chk.on .chk-ico{display:block}
.item-info{flex:1;min-width:0}
.item-name{font-size:14px;font-weight:600;color:var(--text)}
.item-card.done .item-name{text-decoration:line-through;color:var(--text3)}
.who{font-size:10px;padding:2px 6px;border-radius:5px;background:#f1f5f9;color:var(--text2);font-weight:700;margin-top:3px;display:inline-block}
.del-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:17px;padding:4px;flex-shrink:0}
.del-btn:active{color:#ef4444}

/* EMPTY */
.empty{text-align:center;padding:36px 20px;color:var(--text3)}
.empty-ico{font-size:48px;margin-bottom:10px}
.empty-txt{font-size:13px;line-height:1.7;font-weight:500}

/* GHOST (clone arrastado) */
#drag-ghost{position:fixed;left:0;right:0;max-width:430px;margin:0 auto;pointer-events:none;z-index:999;opacity:.92;border-radius:var(--rs);box-shadow:0 8px 30px rgba(0,0,0,.18)}

/* BOTTOM */
#bottom-bar{flex-shrink:0;background:var(--white);border-top:1px solid var(--border);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.bot-btn{flex:1;padding:12px;border-radius:var(--rx);border:none;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.btn-red{background:#fef2f2;color:#ef4444;border:1.5px solid #fecaca}
.btn-grn{background:var(--gl);color:var(--green);border:1.5px solid var(--gm)}

/* LOADER */
#loader{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:9999}
.spin{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">

  <div id="loader">
    <div style="font-size:48px">🛒</div>
    <div style="font-size:13px;color:var(--text2);font-weight:600">Carregando lista...</div>
    <div class="spin"></div>
  </div>

  <!-- HEADER -->
  <div id="header">
    <div class="hd-top">
      <div class="logo"><div class="logo-ico">🛒</div>Lista de Compras</div>
      <div class="hd-right">
        <div class="sync-dot" id="syncdot"></div>
        <button class="user-btn" id="user-btn" onclick="promptNome()">EU</button>
      </div>
    </div>
    <div class="stats-bar">
      <div class="stat"><div class="stat-val" id="s-total">0</div><div class="stat-lbl">Itens</div></div>
      <div class="stat-div"></div>
      <div class="stat"><div class="stat-val" id="s-done" style="color:var(--green)">0</div><div class="stat-lbl">Carrinho</div></div>
      <div class="stat-div"></div>
      <div class="stat"><div class="stat-val" id="s-left" style="color:#f59e0b">0</div><div class="stat-lbl">Faltam</div></div>
    </div>
    <div class="prog-wrap">
      <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
      <div class="prog-lbl" id="prog-lbl">0% concluído</div>
    </div>
  </div>

  <!-- ADD FORM -->
  <div id="add-form">
    <div class="add-row">
      <input class="add-input" type="text" id="inp" placeholder="Ex: Leite, Arroz, Sabão..." autocomplete="off"/>
      <button class="add-btn" id="add-btn">+</button>
    </div>
  </div>

  <!-- SCROLL AREA -->
  <div id="scroll-area">
    <div class="sec-title"><span>🛍️ Para comprar</span></div>
    <div class="sec-hint">Segure o ☰ para reordenar</div>
    <div class="item-list" id="pending-list"></div>

    <div id="done-wrap" style="display:none">
      <div class="sec-title">
        <span>✅ No carrinho</span>
        <button class="clear-btn" onclick="clearDone()">Remover todos</button>
      </div>
      <div class="item-list" id="done-list"></div>
    </div>
  </div>

  <!-- BOTTOM -->
  <div id="bottom-bar">
    <button class="bot-btn btn-red" onclick="clearDone()">🗑 Limpar carrinho</button>
    <button class="bot-btn btn-grn" onclick="clearAll()">✨ Nova lista</button>
  </div>
</div>

<!-- GHOST -->
<div id="drag-ghost" style="display:none"></div>

<script>
let DB={}, orderMap={}, meuNome=localStorage.getItem("lc_nome")||"Eu";

// ── FIREBASE ──
function initFB(){
  const dot=document.getElementById("syncdot");
  window._onValue(window._ref(window._db,"lista"),snap=>{
    DB=snap.val()||{};
    Object.entries(DB).forEach(([k,v])=>{if(v.order!=null)orderMap[k]=v.order});
    dot.className="sync-dot ok";
    render();
  },()=>{dot.className="sync-dot err"});
  document.getElementById("loader").style.display="none";
  document.getElementById("user-btn").textContent=meuNome.slice(0,2).toUpperCase();
}
window.addEventListener("fbready",initFB);
setTimeout(()=>{if(!window._fbReady)document.getElementById("loader").innerHTML=`<div style="padding:24px;text-align:center;font-weight:700">⚠️ Sem conexão</div>`;},6000);

// ── DATA ──
function arr(){return Object.entries(DB).map(([k,v])=>({...v,_key:k}))}
function pending(){return arr().filter(i=>!i.done).sort((a,b)=>(orderMap[a._key]??a.ts??0)-(orderMap[b._key]??b.ts??0))}
function done(){return arr().filter(i=>i.done).sort((a,b)=>a.doneAt-b.doneAt)}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

function promptNome(){
  const n=prompt("Seu nome:",meuNome);
  if(n&&n.trim()){meuNome=n.trim();localStorage.setItem("lc_nome",meuNome);document.getElementById("user-btn").textContent=meuNome.slice(0,2).toUpperCase()}
}

// ── RENDER ──
function render(){
  const p=pending(),d=done(),total=p.length+d.length,pct=total?Math.round(d.length/total*100):0;
  document.getElementById("s-total").textContent=total;
  document.getElementById("s-done").textContent=d.length;
  document.getElementById("s-left").textContent=p.length;
  document.getElementById("prog-fill").style.width=pct+"%";
  document.getElementById("prog-lbl").textContent=pct+"% concluído";

  const pl=document.getElementById("pending-list");
  pl.innerHTML=p.length===0
    ?`<div class="empty"><div class="empty-ico">${total===0?"🛒":"🎉"}</div><div class="empty-txt">${total===0?"Lista vazia!<br>Adicione itens acima.":"Tudo no carrinho!<br>Boas compras! 🛒"}</div></div>`
    :p.map(card).join("");

  const dw=document.getElementById("done-wrap");
  const dl=document.getElementById("done-list");
  if(d.length===0){dw.style.display="none"}
  else{dw.style.display="block";dl.innerHTML=d.map(i=>card(i,true)).join("")}

  initDrag();
}

function card(item,isDone=false){
  return`<div class="item-card${isDone?" done":""}" data-key="${item._key}">
    <div class="handle" data-handle="${item._key}"><span></span><span></span><span></span></div>
    <div class="chk${isDone?" on":""}" data-toggle="${item._key}" data-done="${isDone}"><span class="chk-ico">✓</span></div>
    <div class="item-info">
      <div class="item-name">${esc(item.nome)}</div>
      ${item.quem?`<span class="who">👤 ${esc(item.quem)}</span>`:""}
    </div>
    <button class="del-btn" data-del="${item._key}">✕</button>
  </div>`;
}

// ── CLICK DELEGATION ──
document.getElementById("scroll-area").addEventListener("click",e=>{
  const tog=e.target.closest("[data-toggle]");
  if(tog){toggleItem(tog.dataset.toggle, tog.dataset.done==="true"); return}
  const del=e.target.closest("[data-del]");
  if(del){delItem(del.dataset.del)}
});

// ── ACTIONS ──
function addItem(){
  const el=document.getElementById("inp"), nome=el.value.trim();
  if(!nome)return;
  const maxO=Object.values(orderMap).length?Math.max(...Object.values(orderMap))+1:Date.now();
  window._push(window._ref(window._db,"lista"),{nome,quem:meuNome,done:false,ts:Date.now(),doneAt:0,order:maxO});
  el.value=""; el.focus();
}
function toggleItem(key,isDone){window._update(window._ref(window._db,"lista/"+key),{done:!isDone,doneAt:!isDone?Date.now():0})}
function delItem(key){window._remove(window._ref(window._db,"lista/"+key))}
function clearDone(){if(!done().length)return;if(!confirm("Remover itens do carrinho?"))return;done().forEach(i=>window._remove(window._ref(window._db,"lista/"+i._key)))}
function clearAll(){if(!arr().length)return;if(!confirm("Limpar toda a lista?"))return;arr().forEach(i=>window._remove(window._ref(window._db,"lista/"+i._key)))}

// ── DRAG & DROP (touch-native) ──
let dragKey=null, ghostEl=null, startY=0, scrollEl=null, rafId=null;
let itemHeight=0, listTop=0;

function initDrag(){
  document.querySelectorAll("[data-handle]").forEach(h=>{
    h.addEventListener("touchstart",onTouchStart,{passive:false});
  });
}

function onTouchStart(e){
  e.preventDefault();
  e.stopPropagation();
  dragKey=e.currentTarget.dataset.handle;
  const card=document.querySelector(`[data-key="${dragKey}"]`);
  if(!card)return;

  scrollEl=document.getElementById("scroll-area");
  const rect=card.getBoundingClientRect();
  itemHeight=rect.height;
  startY=e.touches[0].clientY-rect.top;

  // create ghost
  ghostEl=document.getElementById("drag-ghost");
  ghostEl.innerHTML=card.outerHTML;
  ghostEl.style.display="block";
  ghostEl.style.width=rect.width+"px";
  ghostEl.style.top=rect.top+"px";
  ghostEl.style.left=rect.left+"px";
  ghostEl.style.right="auto";
  ghostEl.style.maxWidth="none";
  ghostEl.style.background="#fff";
  ghostEl.style.border="2px solid var(--green)";

  card.classList.add("is-dragging");

  document.addEventListener("touchmove",onTouchMove,{passive:false});
  document.addEventListener("touchend",onTouchEnd);
}

function onTouchMove(e){
  e.preventDefault();
  if(!ghostEl||!dragKey)return;
  const clientY=e.touches[0].clientY;
  ghostEl.style.top=(clientY-startY)+"px";

  // auto scroll
  const scrollRect=scrollEl.getBoundingClientRect();
  if(clientY>scrollRect.bottom-50) scrollEl.scrollTop+=6;
  if(clientY<scrollRect.top+50) scrollEl.scrollTop-=6;

  // highlight target
  const cards=[...document.querySelectorAll("#pending-list .item-card:not(.is-dragging)")];
  cards.forEach(c=>c.classList.remove("drag-above","drag-below"));
  const target=cards.find(c=>{
    const r=c.getBoundingClientRect();
    return clientY>=r.top&&clientY<=r.bottom;
  });
  if(target){
    const r=target.getBoundingClientRect();
    const mid=r.top+r.height/2;
    target.classList.add(clientY<mid?"drag-above":"drag-below");
  }
}

function onTouchEnd(e){
  document.removeEventListener("touchmove",onTouchMove);
  document.removeEventListener("touchend",onTouchEnd);

  const clientY=e.changedTouches[0].clientY;
  const cards=[...document.querySelectorAll("#pending-list .item-card:not(.is-dragging)")];
  cards.forEach(c=>c.classList.remove("drag-above","drag-below"));

  const target=cards.find(c=>{
    const r=c.getBoundingClientRect();
    return clientY>=r.top&&clientY<=r.bottom;
  });

  // cleanup
  if(ghostEl){ghostEl.style.display="none";ghostEl.innerHTML=""}
  const draggingEl=document.querySelector(".is-dragging");
  if(draggingEl)draggingEl.classList.remove("is-dragging");

  if(target&&target.dataset.key!==dragKey){
    reorder(dragKey,target.dataset.key,clientY);
  }
  dragKey=null;
}

function reorder(fromKey,toKey,clientY){
  const p=pending();
  const fi=p.findIndex(i=>i._key===fromKey);
  const ti=p.findIndex(i=>i._key===toKey);
  if(fi===-1||ti===-1)return;
  const arr2=[...p];
  const[moved]=arr2.splice(fi,1);

  // check above/below midpoint
  const toCard=document.querySelector(`[data-key="${toKey}"]`);
  let insertIdx=ti;
  if(toCard){
    const r=toCard.getBoundingClientRect();
    if(clientY>r.top+r.height/2) insertIdx=ti+(fi<ti?0:1);
    else insertIdx=ti-(fi>ti?0:1);
  }
  insertIdx=Math.max(0,Math.min(insertIdx,arr2.length));
  arr2.splice(insertIdx,0,moved);

  arr2.forEach((item,idx)=>{
    orderMap[item._key]=idx;
    window._update(window._ref(window._db,"lista/"+item._key),{order:idx});
  });
}

// ── BUTTON EVENTS ──
const addBtn=document.getElementById("add-btn");
addBtn.addEventListener("touchend",e=>{e.preventDefault();addItem()});
addBtn.addEventListener("click",()=>addItem());
document.getElementById("inp").addEventListener("keydown",e=>{if(e.key==="Enter")addItem()});
</script>
</body>
</html>
