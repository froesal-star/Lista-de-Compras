<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Lista de Compras"/>
<meta name="theme-color" content="#ffffff"/>
<title>Lista de Compras</title>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, push, remove, update }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  const firebaseConfig = {
    apiKey: "AIzaSyDB21rD8B3f_b2rLcIiulAqgrZIYdyPLvI",
    authDomain: "controle-de-custos-39c67.firebaseapp.com",
    databaseURL: "https://controle-de-custos-39c67-default-rtdb.firebaseio.com",
    projectId: "controle-de-custos-39c67",
    storageBucket: "controle-de-custos-39c67.firebasestorage.app",
    messagingSenderId: "320742412317",
    appId: "1:320742412317:web:acc6d8fdcfe5597e3c36f4"
  };
  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);
  window._db=db; window._ref=ref; window._onValue=onValue;
  window._push=push; window._remove=remove; window._update=update;
  window._fbReady=true;
  window.dispatchEvent(new Event("fbready"));
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --green:#16a34a;--green-light:#dcfce7;--green-mid:#bbf7d0;
  --bg:#f8fafc;--white:#ffffff;--text:#1e293b;--text2:#64748b;--text3:#94a3b8;
  --border:#e2e8f0;--border2:#cbd5e1;--radius:16px;--radius-sm:12px;--radius-xs:8px;
  --shadow:0 1px 8px rgba(0,0,0,.08)
}
html,body{height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text)}
#app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* HEADER */
header{background:var(--white);padding:env(safe-area-inset-top,16px) 18px 0;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.header-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px}
.logo{display:flex;align-items:center;gap:9px}
.logo-ico{width:34px;height:34px;border-radius:10px;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:18px}
.logo-txt{font-size:18px;font-weight:800;color:var(--text)}
.header-right{display:flex;align-items:center;gap:8px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#fbbf24;transition:background .3s}
.sync-dot.ok{background:var(--green)}.sync-dot.err{background:#ef4444}
.user-btn{background:var(--green);border:none;width:32px;height:32px;border-radius:50%;color:#fff;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit}

/* STATS BAR */
.stats-bar{display:flex;padding:10px 18px;background:var(--white);border-bottom:1px solid var(--border)}
.stat{flex:1;text-align:center}
.stat-val{font-size:18px;font-weight:900;color:var(--text)}
.stat-lbl{font-size:10px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-top:1px}
.stat-divider{width:1px;background:var(--border);margin:4px 0}

/* PROGRESS */
.progress-wrap{padding:10px 18px 14px;background:var(--white);border-bottom:1px solid var(--border)}
.progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--green),#22c55e);border-radius:4px;transition:width .4s ease}
.progress-label{font-size:11px;color:var(--text2);font-weight:600;margin-top:5px;text-align:right}

/* CONTENT */
#content{flex:1;padding:16px 14px 120px}

/* ADD FORM */
.add-box{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);padding:14px;margin-bottom:18px;box-shadow:var(--shadow)}
.add-box-title{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px}
.add-row{display:flex;gap:8px}
.add-input{flex:1;padding:11px 13px;border:1.5px solid var(--border2);border-radius:var(--radius-xs);font-size:15px;font-family:inherit;color:var(--text);background:var(--bg);outline:none;transition:border .2s}
.add-input:focus{border-color:var(--green);background:var(--white)}
.add-input::placeholder{color:var(--text3)}
.add-btn{width:44px;height:44px;border-radius:var(--radius-xs);background:var(--green);border:none;color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.add-btn:active{background:#15803d}

/* SECTION TITLE */
.section-title{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.clear-btn{background:none;border:none;color:#ef4444;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}

/* LIST */
.item-list{display:flex;flex-direction:column;gap:7px;margin-bottom:20px}
.item-card{background:var(--white);border-radius:var(--radius-sm);border:1px solid var(--border);padding:13px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);transition:all .2s;cursor:pointer;user-select:none}
.item-card:active{transform:scale(.98)}
.item-card.done{background:#f8fffe;border-color:var(--green-mid);opacity:.75}

/* CHECKBOX */
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;background:var(--white)}
.chk.on{background:var(--green);border-color:var(--green)}
.chk-ico{color:#fff;font-size:15px;font-weight:900;display:none}
.chk.on .chk-ico{display:block}

/* ITEM INFO */
.item-info{flex:1;min-width:0}
.item-name{font-size:15px;font-weight:600;color:var(--text);transition:all .2s}
.item-card.done .item-name{text-decoration:line-through;color:var(--text3)}
.who-badge{font-size:10px;padding:2px 6px;border-radius:5px;background:#f1f5f9;color:var(--text2);font-weight:700;margin-top:4px;display:inline-block}

/* DELETE */
.del-item{background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;padding:4px;line-height:1;flex-shrink:0;transition:color .15s}
.del-item:active{color:#ef4444}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-ico{font-size:52px;margin-bottom:12px}
.empty-txt{font-size:14px;line-height:1.7;font-weight:500}

/* LOADER */
#loader{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:999}
.loader-ico{font-size:52px}
.loader-txt{font-size:14px;color:var(--text2);font-weight:600}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* BOTTOM */
.bottom-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--white);border-top:1px solid var(--border);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:100}
.bottom-btn{flex:1;padding:13px;border-radius:var(--radius-xs);border:none;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-clear-done{background:#fef2f2;color:#ef4444;border:1.5px solid #fecaca}
.btn-clear-all{background:var(--green-light);color:var(--green);border:1.5px solid var(--green-mid)}
</style>
</head>
<body>
<div id="app">

  <div id="loader">
    <div class="loader-ico">🛒</div>
    <div class="loader-txt">Carregando lista...</div>
    <div class="spinner"></div>
  </div>

  <header>
    <div class="header-top">
      <div class="logo">
        <div class="logo-ico">🛒</div>
        <span class="logo-txt">Lista de Compras</span>
      </div>
      <div class="header-right">
        <div class="sync-dot" id="syncdot"></div>
        <button class="user-btn" id="user-btn" onclick="promptNome()">EU</button>
      </div>
    </div>
    <div class="stats-bar">
      <div class="stat"><div class="stat-val" id="s-total">0</div><div class="stat-lbl">Itens</div></div>
      <div class="stat-divider"></div>
      <div class="stat"><div class="stat-val" id="s-done" style="color:var(--green)">0</div><div class="stat-lbl">No carrinho</div></div>
      <div class="stat-divider"></div>
      <div class="stat"><div class="stat-val" id="s-left" style="color:#f59e0b">0</div><div class="stat-lbl">Faltam</div></div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <div class="progress-label" id="progress-label">0% concluído</div>
    </div>
  </header>

  <div id="content">
    <div class="add-box">
      <div class="add-box-title">Adicionar item</div>
      <div class="add-row">
        <input class="add-input" type="text" id="inp-nome" placeholder="Ex: Leite, Arroz, Sabão..." autocomplete="off"/>
        <button class="add-btn" onclick="addItem()">+</button>
      </div>
    </div>

    <div id="pending-section">
      <div class="section-title"><span>🛍️ Para comprar</span></div>
      <div class="item-list" id="pending-list"></div>
    </div>

    <div id="done-section" style="display:none">
      <div class="section-title">
        <span>✅ No carrinho</span>
        <button class="clear-btn" onclick="clearDone()">Remover todos</button>
      </div>
      <div class="item-list" id="done-list"></div>
    </div>
  </div>

  <div class="bottom-bar">
    <button class="bottom-btn btn-clear-done" onclick="clearDone()">🗑 Limpar carrinho</button>
    <button class="bottom-btn btn-clear-all" onclick="clearAll()">✨ Nova lista</button>
  </div>
</div>

<script>
let DB={};
let meuNome=localStorage.getItem("lc_nome")||"Eu";

function itemsArr(){return Object.entries(DB).map(([k,v])=>({...v,_key:k}))}
function pending(){return itemsArr().filter(i=>!i.done).sort((a,b)=>a.ts-b.ts)}
function done(){return itemsArr().filter(i=>i.done).sort((a,b)=>a.doneAt-b.doneAt)}

function promptNome(){
  const n=prompt("Seu nome:",meuNome);
  if(n&&n.trim()){meuNome=n.trim();localStorage.setItem("lc_nome",meuNome);document.getElementById("user-btn").textContent=meuNome.slice(0,2).toUpperCase()}
}

function initFirebase(){
  const dot=document.getElementById("syncdot");
  window._onValue(window._ref(window._db,"lista"),(snap)=>{
    DB=snap.val()||{};
    dot.className="sync-dot ok";
    render();
  },(err)=>{dot.className="sync-dot err"});
  document.getElementById("loader").style.display="none";
  document.getElementById("user-btn").textContent=meuNome.slice(0,2).toUpperCase();
}

window.addEventListener("fbready",initFirebase);
setTimeout(()=>{
  if(!window._fbReady){
    document.getElementById("loader").innerHTML=`<div style="text-align:center;padding:24px">
      <div style="font-size:36px;margin-bottom:10px">⚠️</div>
      <div style="font-size:14px;font-weight:700;color:#1e293b">Sem conexão</div>
      <div style="font-size:12px;color:#64748b;margin-top:6px">Verifique sua internet e recarregue.</div>
    </div>`;
  }
},6000);

function render(){
  const p=pending(),d=done(),total=p.length+d.length;
  const pct=total>0?Math.round((d.length/total)*100):0;
  document.getElementById("s-total").textContent=total;
  document.getElementById("s-done").textContent=d.length;
  document.getElementById("s-left").textContent=p.length;
  document.getElementById("progress-fill").style.width=pct+"%";
  document.getElementById("progress-label").textContent=pct+"% concluído";

  const pl=document.getElementById("pending-list");
  pl.innerHTML=p.length===0
    ?`<div class="empty"><div class="empty-ico">${total===0?"🛒":"🎉"}</div><div class="empty-txt">${total===0?"Sua lista está vazia!<br>Adicione itens acima.":"Tudo no carrinho!<br>Boas compras! 🛒"}</div></div>`
    :p.map(itemCard).join("");

  const ds=document.getElementById("done-section");
  const dl=document.getElementById("done-list");
  if(d.length===0){ds.style.display="none"}
  else{ds.style.display="block";dl.innerHTML=d.map(itemCard).join("")}
}

function itemCard(item){
  return`<div class="item-card${item.done?" done":""}" onclick="toggleItem('${item._key}',${!!item.done})">
    <div class="chk${item.done?" on":""}"><span class="chk-ico">✓</span></div>
    <div class="item-info">
      <div class="item-name">${esc(item.nome)}</div>
      ${item.quem?`<span class="who-badge">👤 ${esc(item.quem)}</span>`:""}
    </div>
    <button class="del-item" onclick="delItem(event,'${item._key}')">✕</button>
  </div>`;
}

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

function addItem(){
  const el=document.getElementById("inp-nome");
  const nome=el.value.trim();
  if(!nome)return;
  window._push(window._ref(window._db,"lista"),{
    nome,quem:meuNome,done:false,ts:Date.now(),doneAt:0
  });
  el.value="";
  el.focus();
}

function toggleItem(key,isDone){
  window._update(window._ref(window._db,"lista/"+key),{
    done:!isDone,doneAt:!isDone?Date.now():0
  });
}

function delItem(e,key){
  e.stopPropagation();
  window._remove(window._ref(window._db,"lista/"+key));
}

function clearDone(){
  if(!done().length)return;
  if(!confirm("Remover todos os itens do carrinho?"))return;
  done().forEach(i=>window._remove(window._ref(window._db,"lista/"+i._key)));
}

function clearAll(){
  if(!itemsArr().length)return;
  if(!confirm("Limpar toda a lista e começar do zero?"))return;
  itemsArr().forEach(i=>window._remove(window._ref(window._db,"lista/"+i._key)));
}

document.getElementById("inp-nome").addEventListener("keydown",e=>{if(e.key==="Enter")addItem()});
</script>
</body>
</html>
